name: SwipeLauncher
options:
  bundleIdPrefix: com.MACHU
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  SwipeLauncher:
    type: application
    platform: iOS
    sources: [App, Shared]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.MACHU.Launcher]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SwipeLauncher
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.MACHU.Launcher
            CFBundleURLSchemes: [swipelauncher]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.MACHU.Launcher
    dependencies:
      - target: LauncherWidget
  LauncherWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.MACHU.Launcher]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: SwipeLauncher
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.MACHU.Launcher.widget

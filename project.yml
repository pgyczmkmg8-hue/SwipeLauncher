name: SwipeLauncher
options:
  bundleIdPrefix: com.MACHU
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  SwipeLauncher:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SwipeLauncher
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.MACHU.Launcher
            CFBundleURLSchemes: [swipelauncher]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.MACHU.Launcher
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LauncherWidget
  LauncherWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: SwipeLauncher
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.MACHU.Launcher.widget
